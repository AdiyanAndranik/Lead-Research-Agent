[project]
name = "lead-agent"
version = "0.1.0"
description = "An agentic AI app that researches companies, scores lead quality, and drafts personalized outreach emails — with human-in-the-loop review before sending."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "langchain>=1.3.10",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.6",
    "langsmith>=0.9.0",
    "lxml>=6.1.1",
    "playwright>=1.60.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
